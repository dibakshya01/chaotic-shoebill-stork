# GoReleaser builds cross-platform binaries + checksums on each tag.
# Local dry run:  goreleaser release --snapshot --clean
version: 2
project_name: shoebill

before:
  hooks:
    - go mod tidy

builds:
  - id: shoebill
    main: ./cmd/shoebill
    binary: shoebill
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/dibakshya01/chaotic-shoebill-stork/internal/buildinfo.Version={{ .Version }}
      - -X github.com/dibakshya01/chaotic-shoebill-stork/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/dibakshya01/chaotic-shoebill-stork/internal/buildinfo.Date={{ .Date }}

archives:
  - id: shoebill
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - catalog/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc

# Homebrew tap (macOS). Requires, in the GitHub repo settings, a secret
# HOMEBREW_TAP_GITHUB_TOKEN = a PAT with write access to the `dibakshya01/homebrew-tap`
# repo (see HANDOFF.md). On each tag, GoReleaser commits an updated Casks/shoebill.rb to
# that tap, so users can `brew install dibakshya01/tap/shoebill`.
# If the secret is unset, the token below is empty and the publish step fails — set the
# secret BEFORE pushing the next tag.
# (Linux users: use the container image, the release binaries, or `go install`.)
homebrew_casks:
  - name: shoebill
    repository:
      owner: dibakshya01
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/dibakshya01/chaotic-shoebill-stork"
    description: "Security Chaos Engineering — prove your security controls actually work."
    license: "Apache-2.0"
    commit_author:
      name: goreleaser-bot
      email: noreply@github.com
    # The binaries are not Apple-notarized, so strip the quarantine flag on install;
    # otherwise Gatekeeper blocks the CLI on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/shoebill"]
          end
