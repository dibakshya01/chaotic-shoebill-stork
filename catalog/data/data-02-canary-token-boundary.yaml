apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: data-02-canary-token-boundary
  version: 1
  title: Canary data-token boundary integrity
family: data
blastRadiusClass: low
description: >
  Seeds a canary data token inside the dataset for {{.target}} and attempts to read or export
  it across the data boundary. The token must never cross the boundary, and any attempt must
  trip the detection tripwire.
controls: [canary-token, data-pipeline, detection-rule]
attackIds: [T1530]
owaspIds: [API3:2023]
controlFamilies: [DPDP-S.8, ISO-A.8.16, NIST-SI-4]
hypothesis:
  statement: >
    The canary data token seeded in {{.target}} never crosses the data boundary; any attempt
    to export it trips the tripwire. Zero canary tokens egress the boundary.
  steadyState:
    - source: prometheus
      query: 'up{job="canary-monitor"}'
      expect: {type: threshold, op: eq, value: 1}
    - source: prometheus
      query: 'canary_data_token_registered_total{service="{{.target}}"}'
      expect: {type: present}
injection:
  detonator: http
  mode: inject
  spec:
    action: canary-token-access
    target: '{{.target}}'
  duration: "45s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="canary-monitor"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: applog
    query: 'service="{{.target}}" AND token="canary_data" AND crossed_boundary=true'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Asserts the ABSENCE of any canary token crossing the data boundary over all traffic in
      the window; the canary is a tripwire and must never egress.
    securityRelevant: true
  - stage: DETECTED
    source: canary
    query: 'canary_data_token_tripped{service="{{.target}}"}'
    expect: {type: present}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: CanaryTokenBoundaryBreach
    expect: {type: present}
    sloMs: 300000
blastRadius:
  maxPods: 1
  maxPctReplicas: 5
  maxDurationSeconds: 60
  maxTrafficPct: 1
expectedNoise:
  - CanaryMonitorHeartbeat
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [data-injection, canary-injection, prod-injection]
