apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: gw-06-jwt-validation-robustness
  version: 1
  title: JWT validation robustness — no unsigned token accepted
family: gateway
blastRadiusClass: high
description: >
  Replays tokens with alg:none, an expired signature, and a wrong issuer against {{.target}}
  and verifies each is rejected. Accepting an unsigned or otherwise invalid token as valid is
  a critical FAIL_OPEN of the authentication layer.
controls: [api-gateway, jwt-validation, authorization-service]
attackIds: [T1550.001]
owaspIds: [API2:2023]
controlFamilies: [ISO-A.8.5, NIST-IA-2, PCI-DSS-8.3]
hypothesis:
  statement: >
    When a token with alg:none, an expired signature, or a wrong issuer is presented to
    {{.target}}, the gateway rejects it with 401; zero invalid tokens are accepted as valid.
  steadyState:
    - source: http
      query: 'GET https://{{.target}}/internal/health'
      expect: {type: value, op: eq, value: 200}
    - source: prometheus
      query: 'gateway_jwt_rejected_total{service="{{.target}}"}'
      expect: {type: present}
injection:
  detonator: http
  mode: inject
  spec:
    action: malformed-jwt-replay
    target: '{{.target}}'
    variants: [alg-none, expired, wrong-issuer]
  duration: "60s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="api-gateway",service="{{.target}}"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: gwlog
    query: 'service="{{.target}}" AND jwt_invalid=true AND code=200'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Fail-open is asserted over ALL traffic: no request bearing an unsigned, expired, or
      wrong-issuer token is served 200. UUID scoping would narrow it to synthetic probes and
      miss a real invalid token being accepted.
    securityRelevant: true
  - stage: DETECTED
    source: prometheus
    query: 'increase(gateway_jwt_rejected_total{service="{{.target}}",reason=~"alg_none|expired|issuer"}[2m])'
    expect: {type: threshold, op: gt, value: 0}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: InvalidJwtSpike
    expect: {type: present}
    sloMs: 300000
  - stage: PAGED
    source: alertmanager
    query: InvalidJwtSpike
    expect: {type: paged}
    sloMs: 600000
blastRadius:
  maxPods: 1
  maxPctReplicas: 5
  maxDurationSeconds: 75
  maxTrafficPct: 1
  requiresDistinctFaultDomains: true
expectedNoise:
  - GatewayAuthFailureRate
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [gateway-injection, prod-injection]
