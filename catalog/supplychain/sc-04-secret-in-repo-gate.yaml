apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: sc-04-secret-in-repo-gate
  version: 1
  title: Secret-in-repo gate fails the pipeline
family: supplychain
blastRadiusClass: low
description: >
  Runs the secret-scanning gate for {{.target}} against a commit carrying a planted test secret
  and verifies the gate fails the build. A pipeline that passes a build containing a committed
  secret leaks credentials into the supply chain.
controls: [ci-pipeline, secret-scanner, policy-engine]
attackIds: [T1552.001]
owaspIds: [A08:2025]
controlFamilies: [ISO-A.8.28, NIST-IA-5, PCI-DSS-6.3]
hypothesis:
  statement: >
    When a commit for {{.target}} contains a secret, the secret-scanning gate fails the build;
    zero builds carrying a committed secret pass the gate.
  steadyState:
    - source: prometheus
      query: 'up{job="secret-scanner"}'
      expect: {type: threshold, op: eq, value: 1}
    - source: prometheus
      query: 'secret_scan_runs_total{service="{{.target}}"} > 0'
      expect: {type: threshold, op: gt, value: 0}
injection:
  detonator: exec
  mode: inject
  spec:
    action: secret-in-commit-inject
    target: '{{.target}}'
  duration: "45s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="secret-scanner"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: applog
    query: 'service="{{.target}}" AND committed_secret=true AND gate_result="pass"'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Asserts the ABSENCE of any build with a committed secret passing the gate over all gate
      runs in the window; UUID scoping would miss a real leaked secret slipping through.
    securityRelevant: true
  - stage: DETECTED
    source: prometheus
    query: 'increase(secret_scan_findings_total{service="{{.target}}"}[2m])'
    expect: {type: threshold, op: gt, value: 0}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: SecretInRepoDetected
    expect: {type: present}
    sloMs: 300000
blastRadius:
  maxPods: 0
  maxPctReplicas: 0
  maxDurationSeconds: 60
  maxTrafficPct: 0
expectedNoise:
  - PipelineGateLatency
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [supplychain-injection, pipeline-injection, prod-injection]
