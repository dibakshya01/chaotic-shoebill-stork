apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: id-08-leaked-credential-canary
  version: 1
  title: Leaked-credential detection via canary
family: identity
blastRadiusClass: low
description: >
  Exercises a planted canary credential associated with {{.target}} from an unexpected context
  and verifies the tripwire fires. The canary must never grant real access, and its use must
  be detected quickly.
controls: [canary-token, detection-rule, secrets-manager]
attackIds: [T1552.001]
owaspIds: [API2:2023]
controlFamilies: [ISO-A.8.16, NIST-SI-4, SOC2-CC7.2]
hypothesis:
  statement: >
    When the canary credential for {{.target}} is used, it grants no real access and the
    detection tripwire fires; zero uses of the canary return live data.
  steadyState:
    - source: prometheus
      query: 'up{job="canary-monitor"}'
      expect: {type: threshold, op: eq, value: 1}
    - source: prometheus
      query: 'canary_credential_registered_total{service="{{.target}}"}'
      expect: {type: present}
injection:
  detonator: http
  mode: inject
  spec:
    action: canary-credential-use
    target: '{{.target}}'
  duration: "45s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="canary-monitor"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: applog
    query: 'service="{{.target}}" AND credential="canary" AND access_result="live_data"'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Asserts the ABSENCE of any canary-credential use returning live data over all traffic in
      the window; the canary is a tripwire and must never grant real access.
    securityRelevant: true
  - stage: DETECTED
    source: canary
    query: 'canary_credential_tripped{service="{{.target}}"}'
    expect: {type: present}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: LeakedCredentialCanary
    expect: {type: present}
    sloMs: 300000
blastRadius:
  maxPods: 1
  maxPctReplicas: 5
  maxDurationSeconds: 60
  maxTrafficPct: 1
expectedNoise:
  - CanaryMonitorHeartbeat
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [identity-injection, canary-injection, prod-injection]
