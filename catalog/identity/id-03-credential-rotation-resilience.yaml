apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: id-03-credential-rotation-resilience
  version: 1
  title: Credential rotation resilience
family: identity
blastRadiusClass: medium
description: >
  Rotates a workload credential used by {{.target}} and verifies the cutover serves no request
  on the stale credential and causes no outage. A request authenticated with a retired
  credential after cutover is a rotation-integrity failure.
controls: [secrets-manager, authorization-service, workload-identity]
attackIds: [T1552.001]
owaspIds: [API2:2023]
controlFamilies: [ISO-A.8.24, NIST-IA-5, PCI-DSS-8.3]
hypothesis:
  statement: >
    When the workload credential for {{.target}} is rotated, all requests use the new
    credential and the service stays available; zero requests are served on the stale one.
  steadyState:
    - source: http
      query: 'GET https://{{.target}}/internal/health'
      expect: {type: value, op: eq, value: 200}
    - source: prometheus
      query: 'credential_rotation_events_total{service="{{.target}}"}'
      expect: {type: present}
injection:
  detonator: exec
  mode: inject
  spec:
    action: credential-rotate
    target: '{{.target}}'
    secret: workload-credential
  duration: "60s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="secrets-manager"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: applog
    query: 'service="{{.target}}" AND credential_generation="stale" AND auth_result="success"'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Asserts the ABSENCE of any successful authentication on the retired credential over all
      traffic after cutover; UUID scoping would miss a real stale-credential acceptance.
    securityRelevant: true
  - stage: DETECTED
    source: prometheus
    query: 'increase(credential_rotation_events_total{service="{{.target}}"}[2m])'
    expect: {type: threshold, op: gt, value: 0}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: CredentialRotationStaleUse
    expect: {type: present}
    sloMs: 300000
blastRadius:
  maxPods: 1
  maxPctReplicas: 5
  maxDurationSeconds: 75
  maxTrafficPct: 1
  requiresDistinctFaultDomains: true
expectedNoise:
  - SecretsManagerReloadRate
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [identity-injection, secrets-injection, prod-injection]
