apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: id-05-untrusted-ca-rejected
  version: 1
  title: Untrusted CA rejected
family: identity
blastRadiusClass: medium
description: >
  Presents a certificate signed by a CA outside the trust bundle to {{.target}} and verifies
  the mesh rejects it. Accepting a certificate from an untrusted CA subverts the trust anchor
  of peer authentication.
controls: [mtls, certificate-authority, trust-bundle]
attackIds: [T1553]
owaspIds: [API8:2023]
controlFamilies: [ISO-A.8.24, NIST-SC-12, NIST-SC-17]
hypothesis:
  statement: >
    When a client presents a certificate signed by a CA not in the trust bundle for
    {{.target}}, the mesh rejects it; zero untrusted-CA sessions are served.
  steadyState:
    - source: prometheus
      query: 'sum(rate(mesh_requests_total{service="{{.target}}",mtls="true",code!~"5.."}[2m])) > 0'
      expect: {type: threshold, op: gt, value: 0}
    - source: prometheus
      query: 'mesh_cert_validation_failed_total{service="{{.target}}"}'
      expect: {type: present}
injection:
  detonator: cert
  mode: inject
  spec:
    action: untrusted-ca-probe
    target: '{{.target}}'
  duration: "45s"
  reversible: true
  revertVerification:
    source: prometheus
    query: 'up{job="sidecar",service="{{.target}}"}'
    expect: {type: threshold, op: eq, value: 1}
assertions:
  - stage: PREVENTED
    source: gwlog
    query: 'service="{{.target}}" AND cert_ca="untrusted" AND code=200'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      Asserts the ABSENCE of any served session on an untrusted-CA certificate over all
      traffic in the window; UUID scoping would miss a real trust-anchor bypass.
    securityRelevant: true
  - stage: DETECTED
    source: prometheus
    query: 'increase(mesh_cert_validation_failed_total{service="{{.target}}",reason="untrusted_ca"}[2m])'
    expect: {type: threshold, op: gt, value: 0}
    sloMs: 60000
  - stage: ALERTED
    source: alertmanager
    query: UntrustedCaRejected
    expect: {type: present}
    sloMs: 300000
blastRadius:
  maxPods: 1
  maxPctReplicas: 5
  maxDurationSeconds: 60
  maxTrafficPct: 1
  requiresDistinctFaultDomains: true
expectedNoise:
  - CertValidationFailureRate
promotion:
  requiresPassIn: [playground, stage, preprod]
  withinDays: 14
capabilities: [identity-injection, cert-injection, prod-injection]
