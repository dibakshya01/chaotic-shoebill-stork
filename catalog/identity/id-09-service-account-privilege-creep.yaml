apiVersion: chaos.shoebill.dev/v1alpha1
kind: SecurityChaosExperiment
metadata:
  name: id-09-service-account-privilege-creep
  version: 1
  title: Service-account privilege creep detection
family: identity
blastRadiusClass: low
description: >
  A read-only check that the service accounts backing {{.target}} hold no grants beyond their
  declared least-privilege baseline, so accumulated permissions cannot widen blast radius.
  observe_only — safe to run at any time.
controls: [authorization-service, service-account, iam-policy]
attackIds: [T1098]
owaspIds: [API5:2023]
controlFamilies: [ISO-A.8.2, NIST-AC-6, SOC2-CC6.3]
hypothesis:
  statement: >
    The service accounts for {{.target}} hold no permission beyond their declared baseline;
    there is zero privilege creep.
  steadyState:
    - source: prometheus
      query: 'serviceaccount_overprivileged_total{service="{{.target}}"} > 0'
      expect: {type: absent}
injection:
  detonator: observe
  mode: observe_only
  spec:
    action: privilege-diff
assertions:
  - stage: PREVENTED
    source: prometheus
    query: 'serviceaccount_grants_beyond_baseline{service="{{.target}}"}'
    expect: {type: absent}
    sloMs: 0
    requireUuid: false
    justification: >
      A drift assertion over the whole grant surface of the service accounts; there is no
      injected run to correlate a UUID against (observe_only).
    securityRelevant: true
  - stage: DETECTED
    source: prometheus
    query: 'iam_policy_review_age_days{service="{{.target}}"}'
    expect: {type: threshold, op: lt, value: 90}
    sloMs: 60000
blastRadius:
  maxPods: 0
  maxPctReplicas: 0
  maxDurationSeconds: 0
  maxTrafficPct: 0
promotion:
  requiresPassIn: []
  withinDays: 14
