apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deploy the whole operator (CRDs + RBAC + manager):
#   kubectl apply -k operator/config/
resources:
  - crd/chaos.shoebill.dev_securitychaosexperiments.yaml
  - crd/chaos.shoebill.dev_securitychaosruns.yaml
