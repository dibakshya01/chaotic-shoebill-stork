apiVersion: v1
kind: Namespace
metadata:
  name: shoebill-system
  labels: {app.kubernetes.io/name: shoebill-operator}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoebill-operator
  namespace: shoebill-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shoebill-operator
rules:
  # The custom resources this controller reconciles.
  - apiGroups: ["chaos.shoebill.dev"]
    resources: ["securitychaosexperiments", "securitychaosruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos.shoebill.dev"]
    resources: ["securitychaosruns/status"]
    verbs: ["get", "update", "patch"]
  # The `netpol` detonator applies and removes a bounded, reversible deny-ingress policy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # Read-only, for targeting + revert verification.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Leader-election (controller-runtime).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shoebill-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shoebill-operator
subjects:
  - kind: ServiceAccount
    name: shoebill-operator
    namespace: shoebill-system
