apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitychaosruns.chaos.shoebill.dev
spec:
  group: chaos.shoebill.dev
  scope: Namespaced
  names:
    kind: SecurityChaosRun
    listKind: SecurityChaosRunList
    plural: securitychaosruns
    singular: securitychaosrun
    shortNames: [scr, scrun]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Experiment
          type: string
          jsonPath: .spec.experimentRef
        - name: Env
          type: string
          jsonPath: .spec.target.env
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Verdict
          type: string
          jsonPath: .status.verdict
      schema:
        openAPIV3Schema:
          type: object
          description: >
            A Security Chaos Run binds an experiment definition to a concrete target.
            Nothing is injected without a Safety Governor decision; the controller
            delegates authorization to the control plane.
          properties:
            spec:
              type: object
              required: [experimentRef, target]
              properties:
                experimentRef: {type: string}
                experimentVersion: {type: integer}
                target:
                  type: object
                  required: [env]
                  properties:
                    service:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        tier: {type: integer, enum: [1, 2, 3]}
                        team: {type: string}
                        onPaymentsPath: {type: boolean}
                    namespace: {type: string}
                    cluster: {type: string}
                    dc: {type: string}
                    env: {type: string, enum: [local, chaos-lab, playground, stage, preprod, prod-canary, prod-ring]}
                    ring: {type: string, enum: [canary, ring]}
                    faultDomainId: {type: string}
                scope:
                  type: object
                  properties:
                    podCount: {type: integer}
                    pctOfReplicas: {type: integer}
                    durationSeconds: {type: integer}
                    pctTraffic: {type: integer}
                approvals:
                  type: array
                  items:
                    type: object
                    properties:
                      role: {type: string}
                      approver: {type: string}
                      team: {type: string}
                      at: {type: string, format: date-time}
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                schedule: {type: string}
                grantedCapabilities:
                  type: array
                  items: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                runId: {type: string}
                runUuid: {type: string}
                verdict: {type: string, enum: [PASS, FAIL_UNDETECTED, FAIL_OPEN, FAIL_SLOW, ABORTED, INCONCLUSIVE]}
                findingId: {type: string}
                receiptId: {type: string}
                refusals:
                  type: array
                  items: {type: string}
      subresources:
        status: {}
