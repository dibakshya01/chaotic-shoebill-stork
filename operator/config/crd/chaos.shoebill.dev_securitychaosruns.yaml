    listKind: SecurityChaosRunList
    plural: securitychaosruns
    shortNames:
    - scr
    - scrun
    singular: securitychaosrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.experimentRef
