apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoebill-operator
  namespace: shoebill-system
  labels: {app.kubernetes.io/name: shoebill-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: shoebill-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shoebill-operator}
    spec:
      serviceAccountName: shoebill-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          # Replace with your pushed image, e.g. ghcr.io/dibakshya01/shoebill-operator:v0.2.0
          image: ghcr.io/dibakshya01/shoebill-operator:latest
          args:
            - --health-probe-bind-address=:8081
            - --evidence-dir=/var/lib/shoebill/evidence
            - --signing-key=/var/lib/shoebill/evidence.key
            # - --prometheus-url=http://prometheus.monitoring:9090
            # - --alertmanager-url=http://alertmanager.monitoring:9093
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/shoebill}
      volumes:
        # Holds the signing key + evidence ledger. Use a PVC to persist across restarts.
        - name: data
          emptyDir: {}
